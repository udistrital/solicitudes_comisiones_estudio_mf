<section class="w-full">
  <div class="max-w-[1280px] mx-auto p-4">

    <!-- Header -->
    <mat-card class="bg-white border border-black/10 rounded-xl px-4 py-3 mb-4 border-l-[6px] border-l-sga">
      <div class="flex flex-wrap items-center gap-4">
        <div class="flex-1 min-w-[280px]">
          <h2 class="m-0 text-[22px] leading-tight font-semibold">{{ title }}</h2>
          <p class="mt-1 mb-0 text-black/70">
            Seleciona un rol para ver la bandeja y acciones (demo).
          </p>
        </div>

        <!-- Selector de rol -->
        <div class="flex items-center justify-end min-w-[320px]">
          <div class="w-full max-w-[360px]">
            <div class="text-xs text-black/60 mb-1">Rol (demo)</div>

            <mat-form-field appearance="outline" subscriptSizing="fixed" class="w-full sga-role">
              <mat-select [value]="selectedRole" (selectionChange)="onRoleChange($event.value)">
                <mat-option *ngFor="let r of roleOptions" [value]="r.value">
                  {{ r.label }}
                </mat-option>
              </mat-select>
            </mat-form-field>
          </div>
        </div>
      </div>
    </mat-card>

    <!-- Tabla -->
    <app-dynamic-table
      [rows]="rows"
      [columns]="columnDefs"
      [actions]="actions"
      [enableColumnFilters]="selectedRole !== 'DOCENTE'"
      (actionClick)="onAction($event.action, $event.row)">
    </app-dynamic-table>

  </div>
</section>
