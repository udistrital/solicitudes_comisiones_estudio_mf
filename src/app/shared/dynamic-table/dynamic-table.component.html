<mat-card class="sga-card sga-card--table">
  <div class="sga-table-frame">
    <div class="sga-table-bar" aria-hidden="true"></div>

    <table mat-table [dataSource]="filteredRows" class="sga-table mat-elevation-z0">

      <!-- Columnas dinámicas -->
      <ng-container *ngFor="let col of columns" [matColumnDef]="col.key">
        <th
          mat-header-cell
          *matHeaderCellDef
          class="sga-th"
          [class]="'sga-th col-' + col.key">

          <div class="sga-th__content">
            <div class="sga-th__label">{{ col.header }}</div>

            <!-- Filtro por columna -->
            <mat-form-field
              *ngIf="enableColumnFilters && isFilterable(col)"
              class="sga-th__filter"
              appearance="outline"
              subscriptSizing="dynamic">
              <input
                matInput
                [placeholder]="col.filterPlaceholder || 'Buscar...'"
                [(ngModel)]="filters[col.key]" />
              <button
                mat-icon-button
                matSuffix
                type="button"
                aria-label="Limpiar"
                *ngIf="filters[col.key]"
                (click)="clearFilter(col.key)">
                <mat-icon>close</mat-icon>
              </button>
            </mat-form-field>
          </div>
        </th>

        <td
          mat-cell
          *matCellDef="let row"
          class="sga-td"
          [class]="'sga-td col-' + col.key">

          <ng-container [ngSwitch]="col.renderAs || 'text'">
            <mat-chip
              *ngSwitchCase="'chip'"
              class="sga-chip"
              [ngClass]="col.chipClass ? col.chipClass(row) : ''">
              {{ col.cell(row) }}
            </mat-chip>

            <span *ngSwitchDefault class="sga-cell-text">
              {{ col.cell(row) }}
            </span>
          </ng-container>
        </td>
      </ng-container>

      <!-- Columna de acciones -->
      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef class="sga-th sga-th--actions col-acciones">
          Acciones
        </th>

        <td mat-cell *matCellDef="let row" class="sga-td sga-td--actions col-acciones">
          <div class="sga-actions">
            <ng-container *ngFor="let a of actions">
              <button
                *ngIf="isVisible(a, row) && (a.variant !== 'flat')"
                mat-stroked-button
                class="sga-btn sga-btn--stroked"
                (click)="emit(a.key, row)">
                {{ a.label }}
              </button>

              <button
                *ngIf="isVisible(a, row) && (a.variant === 'flat')"
                mat-flat-button
                color="primary"
                class="sga-btn sga-btn--flat"
                (click)="emit(a.key, row)">
                {{ a.label }}
              </button>
            </ng-container>
          </div>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>
</mat-card>
