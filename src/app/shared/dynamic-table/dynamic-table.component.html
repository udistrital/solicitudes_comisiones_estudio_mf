<mat-card style="margin: 16px; overflow: auto;">
  <table mat-table [dataSource]="filteredRows" class="mat-elevation-z1" style="width: 100%; min-width: 900px;">

    <!-- Columnas dinámicas -->
    <ng-container *ngFor="let col of columns" [matColumnDef]="col.key">
      <th mat-header-cell *matHeaderCellDef>
        <div style="display:flex; flex-direction:column; gap:8px;">
          <div>{{ col.header }}</div>

          <!-- Filtro por columna -->
          <mat-form-field
            *ngIf="enableColumnFilters && isFilterable(col)"
            appearance="outline"
            style="width: 100%;"
            subscriptSizing="dynamic">
            <input
              matInput
              [placeholder]="col.filterPlaceholder || 'Buscar...'"
              [(ngModel)]="filters[col.key]" />
            <button
              mat-icon-button
              matSuffix
              type="button"
              aria-label="Limpiar"
              *ngIf="filters[col.key]"
              (click)="clearFilter(col.key)">
              <mat-icon>close</mat-icon>
            </button>
          </mat-form-field>
        </div>
      </th>

      <td mat-cell *matCellDef="let row">
        <ng-container [ngSwitch]="col.renderAs || 'text'">
          <mat-chip *ngSwitchCase="'chip'" [ngClass]="col.chipClass ? col.chipClass(row) : ''">
            {{ col.cell(row) }}
          </mat-chip>

          <span *ngSwitchDefault>
            {{ col.cell(row) }}
          </span>
        </ng-container>
      </td>
    </ng-container>

    <!-- Columna de acciones -->
    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef>
        <div>Acciones</div>
        <!-- No filtro en acciones -->
      </th>

      <td mat-cell *matCellDef="let row" style="white-space: nowrap;">
        <ng-container *ngFor="let a of actions">
          <button
            *ngIf="isVisible(a, row) && (a.variant !== 'flat')"
            mat-stroked-button
            (click)="emit(a.key, row)"
            style="margin-right: 8px;">
            {{ a.label }}
          </button>

          <button
            *ngIf="isVisible(a, row) && (a.variant === 'flat')"
            mat-flat-button
            color="primary"
            (click)="emit(a.key, row)"
            style="margin-right: 8px;">
            {{ a.label }}
          </button>
        </ng-container>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</mat-card>
